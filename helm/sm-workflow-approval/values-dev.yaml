# DEV 环境覆盖 values（通过 -f values-dev.yaml 合并）
replicaCount: 1

image:
  tag: "2.1.0"

config:
  env: dev
  logLevel: DEBUG
  logFormat: console
  databaseHost: "sm-workflow-approval-pg"
  databaseName: "sm_workflow_approval"
  allowedHosts: "sm-workflow-approval.dev.sm.example.com,localhost"

