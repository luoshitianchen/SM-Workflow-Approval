[project]
name = "SM-Workflow-Approval"
version = "2.0.0"
description = "流程审批引擎：流程定义、审批请求、多级审批与驳回"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
